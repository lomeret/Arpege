name: Build & Release Arpège

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required to create the release and push its tag.
permissions:
  contents: write

# One run per branch/PR: successive pushes cancel the previous run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must satisfy pubspec.lock (sdks: flutter >=3.41.0 / dart >=3.10.0),
  # otherwise `flutter pub get` fails on pdfrx. Aligned with the local SDK.
  FLUTTER_VERSION: "3.44.7"

jobs:
  # --------------------------------------------------------------------------
  # Computes the release tag / name / type from the triggering event.
  # --------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      build: ${{ steps.m.outputs.build }}
      tag: ${{ steps.m.outputs.tag }}
      title: ${{ steps.m.outputs.title }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      publish: ${{ steps.m.outputs.publish }}
    steps:
      # fetch-depth: 0 = full history, needed by `git rev-list --count`
      # below (a shallow clone would always report 1).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine version, build number and tag
        id: m
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          # App version: from pubspec.yaml, without the "+build" (manual
          # bump, a human decision).
          VERSION=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml | head -n1)
          VERSION=${VERSION:-0.0.0}

          # Build number: number of commits reaching this ref. Deterministic
          # and monotonic (unlike github.run_number, which also moves on a
          # plain re-run or a manual dispatch with no new commit). Used both
          # for the release tag and the number embedded in the binaries
          # (APK versionCode, Windows AppVersion, Debian revision).
          BUILD=$(git rev-list --count HEAD)

          case "$EVENT" in
            push)
              if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                # Official release: the tag already exists (v1.2.3).
                TAG="$REF_NAME"; TITLE="Arpège $REF_NAME"; PRE=false
              else
                # Every commit on main: a dated build, marked pre-release.
                TAG="v${VERSION}-build.${BUILD}"; TITLE="Arpège ${VERSION} (build ${BUILD})"; PRE=true
              fi
              PUBLISH=true
              ;;
            pull_request)
              TAG="pr-${PR_NUMBER}-build.${BUILD}"
              TITLE="Arpège — PR #${PR_NUMBER} (build ${BUILD})"
              PRE=true
              # A PR from a fork only has a read-only token: still build it,
              # but a release cannot be published.
              if [ "$PR_REPO" = "$GITHUB_REPOSITORY" ]; then PUBLISH=true; else PUBLISH=false; fi
              ;;
            *)
              TAG="v${VERSION}-manual.${BUILD}"; TITLE="Arpège ${VERSION} (manual ${BUILD})"
              PRE=true; PUBLISH=true
              ;;
          esac

          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "prerelease=$PRE"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "→ tag=$TAG build=$BUILD prerelease=$PRE publish=$PUBLISH"

  # --------------------------------------------------------------------------
  # Linux: .deb (installer/build_deb.py) + Android: .apk
  # --------------------------------------------------------------------------
  linux-android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev dpkg

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Blocking: pure logic (history, JSON serialization, search…), run
      # once here rather than in every build job.
      - name: Unit tests
        run: flutter test

      # Informational: must not block publishing a build.
      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      # build_deb.py itself runs `flutter build linux --release`,
      # then assembles the Debian tree and calls dpkg-deb → dist/*.deb
      - name: Build the .deb package
        env:
          ARPEGE_BUILD_NUMBER: ${{ needs.meta.outputs.build }}
        run: python3 installer/build_deb.py

      # --build-number: Android versionCode, must be a strictly increasing
      # integer (required by the Play Store) — commit count fits well.
      - name: Build the Android APK
        run: flutter build apk --release --build-number=${{ needs.meta.outputs.build }}

      - name: Rename the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/arpege-${{ needs.meta.outputs.version }}+${{ needs.meta.outputs.build }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: arpege-linux-android
          path: |
            dist/*.deb
            dist/*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Windows: .exe installer (Inno Setup via installer/build_installer.py)
  # --------------------------------------------------------------------------
  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable developer mode (pdfrx symlinks)
        shell: cmd
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check / install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # build_installer.py runs `flutter build windows --release`
      # then compiles installer/arpege.iss → dist/Arpege-Setup-<version>.exe
      - name: Build the Windows installer
        shell: pwsh
        env:
          # The runner console is cp1252: without this, a plain print with
          # an accented character or emoji crashes the script after a
          # successful build.
          PYTHONUTF8: "1"
          ARPEGE_BUILD_NUMBER: ${{ needs.meta.outputs.build }}
        run: python installer/build_installer.py

      - uses: actions/upload-artifact@v4
        with:
          name: arpege-windows
          path: dist/*.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Publishes the release with all 3 binaries
  # --------------------------------------------------------------------------
  release:
    needs: [meta, linux-android, windows]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather the binaries
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.deb' \) \
            -exec cp {} release/ \;
          ls -lh release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          TITLE: ${{ needs.meta.outputs.title }}
          PRE: ${{ needs.meta.outputs.prerelease }}
          # On a PR, GITHUB_SHA is the merge commit: tag the PR's HEAD instead.
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A re-run reuses the same tag: start from a clean release.
          # (the tag itself is kept — a manually pushed tag is never deleted)
          gh release delete "$TAG" --yes 2>/dev/null || true

          NOTES=$(printf '%s\n' \
            "Automatic build of \`${TARGET:0:7}\` (${GITHUB_REF_NAME})." \
            "" \
            "| Platform | File | Install |" \
            "| --- | --- | --- |" \
            "| Android | \`.apk\` | Allow unknown sources, then open the file |" \
            "| Windows | \`Arpege-Setup-*.exe\` | Double-click, follow the wizard |" \
            "| Debian/Ubuntu | \`.deb\` | \`sudo apt install ./arpege_*_amd64.deb\` |" \
            "" \
            "> The APK is signed with the Flutter debug key (no release keystore configured).")

          PRE_FLAG=""
          if [ "$PRE" = "true" ]; then PRE_FLAG="--prerelease"; fi

          gh release create "$TAG" \
            --target "$TARGET" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $PRE_FLAG \
            release/*

      - name: Summary
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          echo "Release published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  # Clear message when a fork PR cannot publish (read-only token).
  fork-notice:
    needs: [meta, linux-android, windows]
    if: needs.meta.outputs.publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "PR from a fork: binaries are available in the run's artifacts, no release published (read-only token)." >> "$GITHUB_STEP_SUMMARY"
